version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'msw', 'jsdom']
      tooling:
        patterns:
          [
            'oxlint',
            'prettier*',
            'typescript',
            'vite',
            '@vitejs/*',
            'tailwindcss',
            '@tailwindcss/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
