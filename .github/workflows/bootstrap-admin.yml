name: Bootstrap first admin (live)

# Runbook step: creates the first Studio admin once. Refuses when any admin exists. The temporary
# password comes from the environment secret BOOTSTRAP_ADMIN_PASSWORD (delete it afterwards) and
# must be changed at the first sign-in; TOTP is enrolled right after.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'E-mail of the first admin'
        required: true
        type: string
      name:
        description: 'Display name (2–60 characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # The inputs are personal data and this repository's logs are public: mask them before any
      # step shows them. Read from the event file, so this step's own log holds neither.
      - name: Mask the inputs
        run: >-
          node -e 'const { email = "", name = "" } = require(process.env.GITHUB_EVENT_PATH).inputs;
          for (const value of new Set([email, email.trim(), email.trim().toLowerCase(), name, name.trim()]))
          if (value) console.log(`::add-mask::${value}`)'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: a dependency never runs code next to the production secrets.
      - run: npm ci --ignore-scripts
      - name: Create the first admin
        run: node scripts/bootstrap-admin.mjs
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_NAME: ${{ inputs.name }}
          ADMIN_TEMP_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
