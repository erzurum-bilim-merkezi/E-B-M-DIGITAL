name: DB migrate (live)

# ADR 0016 "Uygula · 1 kez": the only way migrations reach the live database. Manual, after the
# CI rehearsal on a local stack passed for this commit, and approved twice (environment
# `production`): first the read-only dry run, then — once its list was read — the change.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the Supabase project ref to confirm (Project Settings → General)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  plan:
    name: Dry run (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit (v1.7.3): third-party code runs in the job that holds the live secrets.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.117.0
      - name: Confirmation matches the project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Secrets SUPABASE_DB_URL and SUPABASE_PROJECT_REF of the production environment are missing."
            exit 1
          fi
          if [ "$CONFIRM" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::The confirmation does not match the project ref."
            exit 1
          fi
      - name: Pending migrations
        # Session pooler (IPv4, port 5432): GitHub runners have no IPv6 for the direct address.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee dry-run.txt
          {
            echo '### Pending migrations (dry run)'
            echo '```'
            cat dry-run.txt
            echo '```'
            echo 'Approve the **Backup · push · verify** job only if this is the list you expect.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Backup · push · verify
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit (v1.7.3): see the plan job.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.117.0
      - name: Encrypted backup before any change
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$AGE_PUBLIC_KEY" ]; then
            echo "::error::Secret BACKUP_AGE_PUBLIC_KEY is missing: the backup cannot be encrypted."
            exit 1
          fi
          sudo apt-get install -y age > /dev/null
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          tar czf backup.tar.gz backup
          age -r "$AGE_PUBLIC_KEY" -o "backup-${GITHUB_RUN_ID}.tar.gz.age" backup.tar.gz
          rm -rf backup backup.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.tar.gz.age
          retention-days: 7
      - name: Apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Live schema equals the repository
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          expected="$(ls supabase/migrations/*.sql | sort | tail -1 | xargs basename | cut -d_ -f1)"
          live="$(psql "$SUPABASE_DB_URL" -At -c 'select public.schema_version()')"
          echo "repository: $expected · live: $live"
          if [ "$live" != "$expected" ]; then
            echo "::error::schema_version() is $live, the newest migration is $expected."
            exit 1
          fi
