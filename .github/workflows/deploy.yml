name: Deploy

# Publishes the site to GitHub Pages — only after CI (incl. E2E + accessibility) passed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job only reads; Pages rights are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  build:
    name: Build site
    # `branches: [main]` above matches the triggering run's branch *name* — a fork's PR from its own
    # `main` would match too. Deploy only successful CI runs of pushes to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refuse to launch on the mock backend
        # The in-browser mock (demo accounts, local data) must never be the public app (ADR 0013).
        env:
          VITE_COMING_SOON: ${{ vars.VITE_COMING_SOON || 'true' }}
        run: |
          if [ "$VITE_COMING_SOON" != "true" ] && grep -q "= 'mock'" src/shared/config/backend.ts; then
            echo "::error::Launch needs the live backend (F12). Keep VITE_COMING_SOON=true until then."
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_ENV: production
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # Launch day: set VITE_COMING_SOON=false and re-run this workflow.
          VITE_COMING_SOON: ${{ vars.VITE_COMING_SOON || 'true' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Prepare artifact
        run: |
          # Hidden source maps are for error tracking only — never publish them.
          find dist -name '*.map' -delete
          # SPA fallback: GitHub Pages serves 404.html for unknown paths (deep links).
          cp dist/index.html dist/404.html
          # Test hooks must never ship.
          if grep -rq "__KASIF_E2E__" dist; then echo "::error::E2E hooks found in dist"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
