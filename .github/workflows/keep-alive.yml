name: Keep the Supabase project awake

# The Free plan pauses a project after 7 idle days: a harmless ping every 3 days. Uses only the
# public values of the site (repository variables), no secret.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.VITE_SUPABASE_URL != ''
    steps:
      - name: ping()
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          answer="$(curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}')"
          echo "$answer"
          [ "$answer" = '"pong"' ]
