server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build assets never change — cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Hidden sourcemaps are for error tracking upload only — never serve them.
  location ~* \.map$ {
    return 404;
  }

  # Entry points must always be revalidated so deployments take effect.
  location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
