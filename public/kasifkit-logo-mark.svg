<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3486"/>
      <stop offset=".55" stop-color="#1E1B54"/>
      <stop offset="1" stop-color="#0D0B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#6C63FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D6E8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324A"/>
      <stop offset="1" stop-color="#0A1B2B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BE0C8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2BE0C8"/>
      <stop offset="1" stop-color="#2BE0C8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#05041A" flood-opacity=".45"/>
    </filter>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="224" height="224" rx="56" fill="url(#space)"/>
  <rect x="8" y="8" width="224" height="224" rx="56" fill="url(#glow)"/>

  <!-- yıldızlar -->
  <g fill="#FFFFFF">
    <circle cx="46" cy="52" r="2.4" opacity=".9"/><circle cx="196" cy="44" r="1.8" opacity=".7"/>
    <circle cx="210" cy="120" r="2" opacity=".8"/><circle cx="34" cy="150" r="1.6" opacity=".6"/>
    <circle cx="176" cy="200" r="2.2" opacity=".7"/><circle cx="60" cy="204" r="1.7" opacity=".6"/>
  </g>
  <path d="M188 74 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 Z" fill="#FFD653" filter="url(#neon)"/>
  <path d="M44 96 l2.6 6.6 6.6 2.6 -6.6 2.6 -2.6 6.6 -2.6 -6.6 -6.6 -2.6 6.6 -2.6 Z" fill="#FFFFFF" opacity=".85"/>

  <!-- yörünge halkası (kafanın arkasından geçer) -->
  <g transform="rotate(-16 120 132)">
    <ellipse cx="120" cy="132" rx="100" ry="30" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="26" cy="132" r="7" fill="#2BE0C8" filter="url(#neon)"/>
  </g>

  <!-- anten -->
  <line x1="120" y1="62" x2="120" y2="42" stroke="#C9D6E8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="34" r="10" fill="#FFB13D" filter="url(#neon)"/>

  <!-- kulak modülleri -->
  <rect x="46" y="104" width="18" height="44" rx="9" fill="#8FA7C4" filter="url(#soft)"/>
  <rect x="176" y="104" width="18" height="44" rx="9" fill="#8FA7C4" filter="url(#soft)"/>

  <!-- kafa -->
  <rect x="58" y="62" width="124" height="112" rx="50" fill="url(#metal)" filter="url(#soft)"/>
  <!-- vizör -->
  <rect x="76" y="86" width="88" height="64" rx="30" fill="url(#visor)"/>
  <path d="M84 100 q36 -16 72 0" stroke="#FFFFFF" stroke-width="5" fill="none"
    stroke-linecap="round" opacity=".28"/>
  <!-- gözler + gülümseme -->
  <g filter="url(#neon)">
    <circle cx="102" cy="116" r="8.5" fill="#4FE3D8"/>
    <circle cx="138" cy="116" r="8.5" fill="#4FE3D8"/>
    <path d="M106 134 q14 11 28 0" stroke="#4FE3D8" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="105" cy="113" r="3" fill="#FFFFFF" opacity=".95"/>
  <circle cx="141" cy="113" r="3" fill="#FFFFFF" opacity=".95"/>

  <!-- yörünge ön parçası (kafanın önünden geçer) -->
  <g transform="rotate(-16 120 132)">
    <path d="M120 162 a100 30 0 0 0 100 -30" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" opacity=".95"/>
    <circle cx="214" cy="132" r="7" fill="#FFD653" filter="url(#neon)"/>
  </g>

  <!-- filiz: markanın bilim+doğa köprüsü, kaskın üstünde minik -->
  <g transform="translate(158 52) scale(.9)">
    <path d="M0 18 C0 10 -1 5 0 -2" stroke="#8FDD8F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 6 C-9 3 -13 -5 -10 -12 C-1 -10 2 -2 0 6 Z" fill="#6BC96F"/>
    <path d="M0 2 C9 -1 13 -9 10 -16 C1 -14 -2 -6 0 2 Z" fill="#B9F0B0"/>
  </g>
</svg>
